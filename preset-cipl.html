<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DocSystem — Commercial Invoice / Packing List</title>
<link rel="stylesheet" href="./preset-typography.css?v=20261116-cipl1">
<style>
/* CIPL uses the same workspace and A4 design scale as Preset Invoice. */
*{box-sizing:border-box}
body{margin:0;background:#eef2f6;color:#14263c;font:13px Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;padding:8px 12px;border:1px solid #cbd5e1;background:#fff;border-radius:6px}
button.primary{background:#183b67;color:#fff}
input,select,textarea{width:100%;min-width:0;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#14263c;padding:8px}
textarea{resize:vertical;min-height:75px}
.bar{padding:10px 18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff}
.bar #status{margin-left:auto}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;max-width:1800px;margin:auto;padding:0 8px;align-items:start}
.editor,.preview-column{min-width:0}
.card{border:1px solid #dce3ea;background:#fff;border-radius:10px;padding:15px;margin:12px 0;min-width:0}
.card h3{font-size:14px;margin:0 0 12px}
label{display:flex;flex-direction:column;gap:4px;min-width:0;margin:0}
.row,.triple{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.preset-settings-fields{width:100%;max-width:305px}
.preset-settings-fields label{font-weight:600}
#ciplBusinessProfileControl{margin-bottom:12px}
#documentFields label,#consigneeFields label,#addresses label,#signatureFields label{font-weight:600}
#documentFields label input,#consigneeFields label input,#addresses label textarea,#signatureFields label input{font-weight:400}
#consigneeFields label:nth-child(2){grid-column:1/-1}
#consigneeFields label:nth-child(2) textarea,#addresses textarea{height:80px;min-height:80px;max-height:80px;line-height:20px;overflow-y:hidden;resize:none}
#signatureFields{max-width:680px}
.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse}
#editorTable{min-width:1250px;table-layout:fixed}
#editorTable th{background:#eaf0f6;color:#14263c;border:1px solid #aebcc9;font-size:11px;padding:6px;text-align:center}
#editorTable td{border:1px solid #aebcc9;padding:4px}
#editorTable td input,#editorTable td textarea{border:0;border-radius:0;min-width:0;padding:5px}
#editorTable td textarea{min-height:50px}
#editorTable button{padding:4px 7px}
.actionbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.preview-column{overflow:hidden}
.preview-header{display:flex;justify-content:space-between;align-items:center;padding:12px 3px;font-weight:700}
.paper{width:210mm;min-height:297mm;padding:12mm 13mm 12mm;background:#fff;color:#000;margin:0 auto 16px;box-shadow:0 4px 15px #0002;font:7.6pt Arial,sans-serif}
.cipl-head{display:grid;grid-template-columns:58% 42%;min-height:47mm;margin-bottom:0}
.cipl-identity{min-width:0}
.cipl-identity img{display:block;max-height:23mm;object-fit:contain}
.cipl-identity .preset-header-slot{line-height:1.3}
.cipl-identity .preset-header-slot:nth-child(2){font-weight:700}
.cipl-right{display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;min-width:0;text-align:right}
.cipl-title{font-size:16pt;font-weight:700;line-height:1.2;white-space:pre-wrap;overflow-wrap:anywhere}
.cipl-meta{margin:8mm 0 0 auto;width:70mm;max-width:100%;font-size:7pt;align-self:flex-end;text-align:right}
.cipl-meta-line{display:grid;grid-template-columns:30mm minmax(0,1fr);gap:1mm;min-height:4mm;align-items:baseline}
.cipl-meta-line b{text-align:right;white-space:nowrap}
.cipl-meta-line span{overflow-wrap:anywhere;text-align:left}
.cipl-section{border:1px solid #333;margin:2mm 0 3mm;break-inside:avoid;page-break-inside:avoid}
.cipl-section-title{background:#000;color:#fff;text-align:center;font-weight:700;padding:1.1mm;font-size:7.6pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cipl-info{width:100%;table-layout:auto;border-collapse:collapse;font:inherit;background:#fff}
.cipl-info th,.cipl-info td{border:0;vertical-align:top;font-size:inherit;line-height:1.35;overflow-wrap:anywhere;background:#fff}
.cipl-info th{width:1%!important;white-space:nowrap!important;text-align:right!important;font-weight:600;padding:1.1mm 2.5mm 1mm .7mm;border-right:1px solid #999!important}
.cipl-info td{width:auto!important;white-space:pre-wrap!important;text-align:left!important;padding:1.1mm 1.7mm 1mm 1.5mm}
.cipl-info tr{break-inside:avoid}
.cipl-info tr+tr th,.cipl-info tr+tr td{border-top:0}
.cipl-client{display:grid;grid-template-columns:56% 44%;min-height:27mm}
.cipl-client>div{min-width:0}
.cipl-client>div+div{border-left:1px solid #999}
.cipl-client .cipl-info{height:100%}
.cipl-client .cipl-info tr:first-child th,.cipl-client .cipl-info tr:first-child td{padding-top:1.5mm}
.cipl-client .cipl-address-row th,.cipl-client .cipl-address-row td{height:16mm}
.cipl-items{width:100%;table-layout:fixed;margin:2mm 0 0;font:7.2pt Arial,sans-serif}
.cipl-items th{background:#000!important;color:#fff!important;font:700 7.2pt Arial,sans-serif!important;line-height:1.2!important;padding:.9mm .3mm!important;border:1px solid #444!important;text-align:center!important;white-space:normal!important;overflow-wrap:anywhere;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cipl-items td{border:1px solid #777;height:8mm;padding:1mm .6mm;vertical-align:top;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;font-size:7.2pt}
.cipl-items td:nth-child(3){text-align:left}
.cipl-items td:nth-child(9),.cipl-items td:nth-child(10){text-align:right}
.cipl-items tbody tr{break-inside:avoid;page-break-inside:avoid}
.cipl-items tbody tr:nth-child(even) td{background:#f5f5f5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cipl-totals{width:76mm;max-width:100%;table-layout:fixed;border-collapse:collapse;margin:1mm 0 3mm auto;font-size:7.6pt;break-inside:avoid}
.cipl-totals th,.cipl-totals td{border:1px solid #777;padding:1.3mm 1mm;background:#fff;color:#111;line-height:1.25}
.cipl-totals th{width:70%;text-align:right;font-weight:700;white-space:nowrap}
.cipl-totals td{width:30%;text-align:right;font-variant-numeric:tabular-nums}
.cipl-bottom{display:grid;grid-template-columns:1fr 1fr;gap:3mm;margin-top:3mm}
.cipl-panel{border:1px solid #777;min-height:23mm;break-inside:avoid}
.cipl-panel h4{margin:0;background:#000;color:#fff;text-align:center;font-size:7.6pt;padding:1.1mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cipl-panel p{white-space:pre-wrap;overflow-wrap:anywhere;padding:2mm;margin:0;line-height:1.35;font-size:7.2pt}
.cipl-cert{font-size:7.2pt;white-space:pre-wrap;line-height:1.35;margin:3mm 0}
.cipl-sign{width:100%;margin:3mm 0;break-inside:avoid}
.cipl-sign strong{display:block;background:#000;color:#fff;text-align:center;padding:1.1mm;font-size:7.6pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cipl-sign table{width:100%;table-layout:fixed;font:7.6pt Arial,sans-serif}
.cipl-sign th{background:#000;color:#fff;width:22%;border:1px solid #333;padding:1mm 2mm;text-align:center;white-space:nowrap;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cipl-sign td{height:9mm;border:1px solid #777;padding:1mm;text-align:center;vertical-align:middle;white-space:pre-wrap}
body.embedded .bar,body.embedded #ciplBusinessProfileControl{display:none}
body.embedded{background:transparent}
@media screen{
 :root{--we-gold:#d3af36;--we-green:#16a34a;--we-red:#dc2626}
 html,body{background:#000;color:#fff}
 .bar{background:#0e0e0e;color:#fff;border-color:#393939}
 .card{background:#0d0d0d;color:#fff;border-color:#393939}
 .card h3,.preview-header{color:#fff}
 label{color:#e5e7eb}
 .card input,.card select,.card textarea{background:#080808;color:#fff;border-color:#4b5563}
 .card input:focus,.card select:focus,.card textarea:focus{outline:1px solid var(--we-gold);border-color:var(--we-gold)}
 .card input::placeholder,.card textarea::placeholder{color:#a8a8a8}
 button,.bar button{background:var(--we-gold);color:#000;border-color:var(--we-gold)}
 #saveBtn{background:var(--we-green);color:#fff;border-color:var(--we-green)}
 #removeRow,button[data-remove]{background:var(--we-red);color:#fff;border-color:var(--we-red)}
 #editorTable th{background:#181818;color:#fff;border-color:#444}
 #editorTable td{border-color:#454545}
 #editorTable td input,#editorTable td textarea{background:#090909;color:#fff}
 .paper{background:#fff;color:#000}
}
@media(max-width:1099px){
 html,body{max-width:100%;overflow-x:hidden}
 .workspace{width:100%;max-width:100%;min-width:0;grid-template-columns:minmax(0,1fr)}
 .workspace .card,.workspace input,.workspace textarea,.workspace select{max-width:100%}
 .preview-column,#paper{width:100%;max-width:100%;min-width:0;overflow-x:hidden}
 .paper{max-width:none!important;transform:none!important}
}
@media(max-width:690px){.row,.triple{grid-template-columns:1fr}}
@media print{
 @page{size:A4 portrait;margin:0}
 html,body{width:210mm!important;background:#fff!important}
 .bar,.editor,.preview-header{display:none!important}
 .workspace{display:block!important;margin:0!important;padding:0!important;width:210mm!important;max-width:none!important}
 .preview-column,#paper{width:210mm!important;max-width:none!important;overflow:visible!important}
 .paper{zoom:1!important;width:210mm!important;min-height:297mm!important;max-height:297mm!important;box-shadow:none!important;margin:0!important;break-after:page}
 .paper:last-child{break-after:auto!important}
}
</style></head><body>
<div class="bar"><strong>Commercial Invoice / Packing List</strong><button id="newBtn">New</button><button class="primary" id="saveBtn">Save Online</button><button id="printBtn">Print / PDF</button><span id="status">Ready</span></div>
<div class="workspace"><div class="editor">
<section class="card preset-settings-card"><h3>Document Settings</h3><div class="preset-settings-fields" id="ciplCurrencyFields"></div></section>
<section class="card"><h3>CIPL Details</h3><label id="ciplBusinessProfileControl">Business Profile<select id="businessSelect"></select></label><div class="row" id="documentFields"></div></section>
<section class="card"><h3>Consignee</h3><div class="row" id="consigneeFields"></div></section>
<section class="card"><h3>Delivery / Collection</h3><div class="preset-settings-fields"><label>Movement Type<select id="movementType"><option value="delivery">Delivery</option><option value="collection">Collection</option></select></label></div><div id="addresses"></div></section>
<section class="card"><h3>Freight / Transport</h3><label>Freight Agent / Transport Company<input data-field="freightAgent" placeholder="Client Appointed"></label></section>
<section class="card"><h3>Invoice & Packing Items</h3><div class="tablewrap"><table id="editorTable"></table></div><div class="actionbar"><button id="addRow">+ Add Item</button><button id="removeRow">Remove Last</button></div><p id="editorTotal"></p></section>
<section class="card"><h3>Packing Details & Comments</h3><label>Packing Details<textarea data-field="packingDetails" rows="4"></textarea></label><label>Comments<textarea data-field="comments" rows="4"></textarea></label><label>Certification Statement<textarea data-field="certification" rows="3"></textarea></label></section>
<section class="card"><h3>Signature — Prepared by Only</h3><div class="row" id="signatureFields"></div></section>
</div><div class="preview-column"><div class="preview-header"><strong>Live A4 CIPL Preview</strong><span id="pageCount"></span></div><div id="paper"></div></div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';

import {getFirestore,doc,getDoc,setDoc,getDocs,collection,query,where,limit,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
import {sharedPresetSlot,expandPresetText,richPresetText} from './preset-shared.js';
import {encodePreset,decodePreset,reportPresetSaved,reportPresetSaveError} from './preset-online-sync.js';
import {refPrefix,fullReference,updateReferenceYear,mountReferenceField,syncReferenceField} from './preset-document-reference.js';
import {paginatePresetDocument} from './preset-pagination.js';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=initializeApp({apiKey:"AIzaSyDPIAoqy9mbWU-4M4kPK9mfSjtVSSA2gI8",authDomain:"docsystem-c29ec.firebaseapp.com",projectId:"docsystem-c29ec",storageBucket:"docsystem-c29ec.firebasestorage.app",messagingSenderId:"25451628479",appId:"1:25451628479:web:ec00096fc84d744c48c30a"});
const auth=getAuth(app),db=getFirestore(app),params=new URLSearchParams(location.search);
if(params.get('embedded')==='1')document.body.classList.add('embedded');
let user=null,role='user',profiles=[],profile=null,globals={},state=null,docId=params.get('docId')||null,savedCompany=null,savedHeader=null,saving=false;
const posted=(kind,data={})=>{if(window.parent!==window)window.parent.postMessage({type:'docsystem-preset-'+kind,...data},location.origin)};
const notify=t=>{$('status').textContent=t;posted('status',{status:t})};
const business=()=>{const c=profile?.company||{};return savedCompany||{id:profile?.id||'',name:c.name||'',logo:c.logo||'',info:typeof c.headerText==='string'&&c.headerText.trim()?c.headerText:(c.fields||[]).filter(x=>x?.value&&x.place!=='footer').map(x=>(x.label?x.label+': ':'')+x.value).join('\n'),placeholders:globals}};
const header=()=>savedHeader||profile?.presetHeader||{};
const expanded=v=>expandPresetText(v,business(),globals);
const today=()=>new Date().toISOString().slice(0,10);
const amount=x=>Number(String(x??'').replace(/,/g,''))||0;
const fmt=n=>Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const cols=[['qty','Qty'],['description','Description'],['packedIn','Packed In'],['serial','Serial Number'],['weight','Net Weight (Kgs)'],['origin','Country of Origin'],['commodity','Customs Commodity Code'],['unitValue','Unit Value'],['totalValue','Total Value']];
const emptyRow=()=>({qty:'',description:'',packedIn:'',serial:'',weight:'',origin:'',commodity:'',unitValue:''});
function blank(){return {fields:{reference:refPrefix('CIPL',today()),date:today(),poNumber:'',deliveryNote:'',jobNumber:'',currency:'USD',freightAgent:'Client Appointed',packingDetails:'',comments:'',certification:'I hereby certify that the above information is true and correct to the best of my knowledge and belief.'},consignee:{company:'',address:'',contact:'',phone:'',email:''},delivery:{address:''},collection:{address:''},movementType:'delivery',items:Array.from({length:3},emptyRow),prepared:{name:'',position:'',date:''}}}
function valueInput(key,label,value,group='fields',multiline=false){return '<label>'+esc(label)+(multiline?'<textarea rows="3" data-group="'+group+'" data-key="'+key+'"'+(key==='address'?' data-address-max-lines="3"':'')+'>'+esc(value||'')+'</textarea>':'<input data-group="'+group+'" data-key="'+key+'" value="'+esc(value||'')+'">')+'</label>'}
function draw(){
 if(!state)return;
 $('businessSelect').innerHTML=profiles.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.company?.name||'Business')+'</option>').join('');
 $('businessSelect').value=profile?.id||'';$('businessSelect').disabled=!!docId;
 const currencies=[...new Set(['USD','MYR',...(state.fields.currency?[state.fields.currency]:[])])];
 $('ciplCurrencyFields').innerHTML='<label>Currency<select data-group="fields" data-key="currency">'+currencies.map(code=>'<option value="'+esc(code)+'" '+(state.fields.currency===code?'selected':'')+'>'+esc(code)+'</option>').join('')+'</select></label>';
 $('documentFields').innerHTML=valueInput('reference','CIPL No.',state.fields.reference)+valueInput('date','Date Created',state.fields.date)+valueInput('poNumber','P.O. No.',state.fields.poNumber)+valueInput('deliveryNote','Delivery Note No.',state.fields.deliveryNote)+valueInput('jobNumber','Job No.',state.fields.jobNumber);
 mountReferenceField($('documentFields').querySelector('[data-key="reference"]'),'CIPL',state.fields.date,state.fields.reference);
 $('consigneeFields').innerHTML=valueInput('company','Company',state.consignee.company,'consignee')+valueInput('address','Address',state.consignee.address,'consignee',true)+valueInput('contact','Contact Person',state.consignee.contact,'consignee')+valueInput('phone','Telephone',state.consignee.phone,'consignee')+valueInput('email','Email',state.consignee.email,'consignee');
 $('movementType').value=state.movementType==='collection'?'collection':'delivery';
 const movement=$('movementType').value;
 $('addresses').innerHTML=valueInput('address',movement==='delivery'?'Delivery Address':'Collection Address',movement==='delivery'?state.delivery.address:state.collection.address,movement,true);
 document.querySelectorAll('[data-field]').forEach(e=>e.value=state.fields[e.dataset.field]||'');
 $('signatureFields').innerHTML=valueInput('name','Name',state.prepared.name,'prepared')+valueInput('position','Position',state.prepared.position,'prepared')+valueInput('date','Date',state.prepared.date,'prepared');
 drawRows();render();
}
function drawRows(){
 $('editorTable').innerHTML='<thead><tr><th>Item</th>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'<th>Remove</th></tr></thead><tbody>'+state.items.map((r,i)=>'<tr><td>'+(i+1)+'</td>'+cols.map(([key])=>'<td>'+(key==='totalValue'?fmt(amount(r.qty)*amount(r.unitValue)):(key==='description'?'<textarea rows="2" data-row="'+i+'" data-col="'+key+'">'+esc(r[key]||'')+'</textarea>':'<input data-row="'+i+'" data-col="'+key+'" value="'+esc(r[key]||'')+'">'))+'</td>').join('')+'<td><button data-remove="'+i+'">×</button></td></tr>').join('')+'</tbody>';
 $('editorTotal').textContent='Total Net Weight: '+fmt(state.items.reduce((a,r)=>a+amount(r.weight),0))+' Kgs · Total Value: '+fmt(state.items.reduce((a,r)=>a+amount(r.qty)*amount(r.unitValue),0))+' '+(state.fields.currency||'USD');
}
function render(){
 if(!state)return;
 const co=business(),h=header(),head={...co,documentTitle:'COMMERCIAL INVOICE / PACKING LIST',documentNumber:state.fields.reference,documentDate:state.fields.date};
 const titleText=h.titleText||'{doctype}',color=/^#[\da-fA-F]{6}$/.test(h.titleColor||'')?h.titleColor:'#d6a900';
 const fontSize=Math.max(9,Math.min(36,Number(h.titleSize)||16));
 const font=['Arial','Verdana','Georgia','Tahoma','Times New Roman'].includes(h.titleFont)?h.titleFont:'Arial';
 const align=['left','center','right'].includes(h.titleAlign)?h.titleAlign:'right';
 const heading='<div class="cipl-title" style="color:'+color+';font-size:'+fontSize+'pt;font-family:'+font+';text-align:'+align+'">'+richPresetText(expandPresetText(titleText,head,globals))+'</div>';
 const extra=h.extraText?'<div style="font-size:'+Math.max(7,Number(h.extraSize)||9)+'pt;text-align:'+(['left','center','right'].includes(h.extraAlign)?h.extraAlign:'right')+'">'+richPresetText(expandPresetText(h.extraText,head,globals))+'</div>':'';
 const meta=[['Date',state.fields.date],['Reference No.',state.fields.reference],['P.O. No.',state.fields.poNumber],['Delivery Note No.',state.fields.deliveryNote],['Job No.',state.fields.jobNumber]];
 const company='<div class="cipl-head"><div class="cipl-identity">'+sharedPresetSlot('logo',head,h,globals)+sharedPresetSlot('name',head,h,globals)+sharedPresetSlot('details',head,h,globals)+'</div><div class="cipl-right">'+heading+extra+'<div class="cipl-meta">'+meta.map(([k,v])=>'<div class="cipl-meta-line"><b>'+esc(k)+':</b><span>'+esc(v||'')+'</span></div>').join('')+'</div></div></div>';
 const info='<div class="cipl-section"><div class="cipl-section-title">Consignee Information</div><div class="cipl-client"><div><table class="cipl-info"><tbody><tr><th>Consignee:</th><td>'+esc(expanded(state.consignee.company))+'</td></tr><tr class="cipl-address-row"><th>Address:</th><td>'+esc(expanded(state.consignee.address))+'</td></tr></tbody></table></div><div><table class="cipl-info"><tbody><tr><th>Contact:</th><td>'+esc(state.consignee.contact)+'</td></tr><tr><th>Telephone:</th><td>'+esc(state.consignee.phone)+'</td></tr><tr><th>Email:</th><td>'+esc(state.consignee.email)+'</td></tr></tbody></table></div></div></div>';
 const movement=state.movementType==='collection'?'collection':'delivery';

 const movementAddress=movement==='delivery'?state.delivery.address:state.collection.address;
 const logistics='<div class="cipl-section"><div class="cipl-section-title">'+movementLabel+' Information</div><table class="cipl-info"><tbody><tr><th>'+movementLabel+' Address:</th><td>'+esc(expanded(movementAddress))+'</td></tr><tr><th>Freight Agent / Transport Company:</th><td>'+esc(expanded(state.fields.freightAgent))+'</td></tr></tbody></table></div>';
 const colWidths=[4,6,24,9,10,9,8,11,9,10];
 const table='<table class="excel-table cipl-items"><colgroup>'+colWidths.map(w=>'<col style="width:'+w+'%">').join('')+'</colgroup><thead><tr>'+['Item','Qty','Description','Packed In','Serial Number','Net Weight (Kgs)','Country of Origin','Customs Commodity Code','Unit Value ('+(state.fields.currency||'USD')+')','Total Value ('+(state.fields.currency||'USD')+')'].map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+state.items.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(r.qty||'')+'</td><td>'+esc(expanded(r.description||''))+'</td><td>'+esc(r.packedIn||'')+'</td><td>'+esc(r.serial||'')+'</td><td>'+esc(r.weight||'')+'</td><td>'+esc(r.origin||'')+'</td><td>'+esc(r.commodity||'')+'</td><td>'+esc(String(r.unitValue||'').trim()?fmt(amount(r.unitValue)):'')+'</td><td>'+fmt(amount(r.qty)*amount(r.unitValue))+'</td></tr>').join('')+'</tbody></table>';
 const weight=state.items.reduce((a,r)=>a+amount(r.weight),0),total=state.items.reduce((a,r)=>a+amount(r.qty)*amount(r.unitValue),0);
 const totals='<table class="cipl-totals"><colgroup><col style="width:70%"><col style="width:30%"></colgroup><tbody><tr><th scope="row">Total Weight (KGS)</th><td>'+fmt(weight)+'</td></tr><tr><th scope="row">Total Value ('+esc(state.fields.currency||'USD')+')</th><td>'+fmt(total)+'</td></tr></tbody></table>';
 const bottom='<div class="cipl-bottom"><div class="cipl-panel"><h4>PACKING DETAILS</h4><p>'+esc(expanded(state.fields.packingDetails))+'</p></div><div class="cipl-panel"><h4>COMMENTS</h4><p>'+esc(expanded(state.fields.comments))+'</p></div></div>';
 const sign='<div class="cipl-cert">'+esc(expanded(state.fields.certification))+'</div><div class="cipl-sign"><strong>Prepared by</strong><table><tbody><tr><th>Name:</th><td>'+esc(state.prepared.name||'')+'</td></tr><tr><th>Position:</th><td>'+esc(state.prepared.position||'')+'</td></tr><tr><th>Date:</th><td>'+esc(state.prepared.date||'')+'</td></tr><tr><th>Signature:</th><td style="height:15mm"></td></tr></tbody></table></div>';
 $('paper').innerHTML='<article class="paper">'+company+info+logistics+table+totals+bottom+sign+'</article>';
 paginatePresetDocument($('paper'),{fit:'normal'});
 $('pageCount').textContent=$('paper').querySelectorAll('.paper').length+' page(s)';
 fitPreview();posted('height',{height:document.documentElement.scrollHeight+8});
}
function fitPreview(){const holder=document.querySelector('.preview-column'),width=holder?.clientWidth||window.innerWidth;const zoom=Math.min(1,Math.max(.15,(width-24)/(210*96/25.4)));$('paper').querySelectorAll('.paper').forEach(p=>p.style.zoom=String(Math.round(zoom*1000)/1000))}
function ready(){posted('ready',{profiles:profiles.map(p=>({id:p.id,name:p.company?.name||'Business'})),selected:profile?.id||'',locked:!!docId,status:$('status').textContent})}
function fresh(){docId=null;savedCompany=null;savedHeader=null;state=blank();draw();notify('New CIPL ready');ready()}
async function loadSaved(id){const snap=await getDoc(doc(db,'documents',id));if(!snap.exists())throw Error('Document not found');const data=snap.data();if(data.templateFamily!=='commercial-invoice-packing-list')throw Error('Not a CIPL');docId=id;state=decodePreset(data.presetData);if(!['delivery','collection'].includes(state.movementType))state.movementType=state.collection?.address&&!state.delivery?.address?'collection':'delivery';savedCompany=decodePreset(data.companySnapshot||null);savedHeader=decodePreset(data.presetHeaderSnapshot||null);profile=profiles.find(p=>p.id===data.profileId)||profile;if(params.get('duplicate')==='1'){docId=null;state.fields.reference=refPrefix('CIPL',state.fields.date);notify('Duplicate ready; enter a new CIPL number')}else notify('Opened '+data.number);draw();ready()}
function dialog(reference,duplicate){return new Promise(resolve=>{let host=document;try{if(window.top!==window&&window.top.document?.body)host=window.top.document}catch(e){}const veil=host.createElement('div');veil.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#0009;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px';const card=host.createElement('div');card.style.cssText='background:#192321;color:#fff;padding:24px;border-radius:14px;max-width:540px;width:100%;box-shadow:0 15px 40px #0008;font:15px Arial';card.setAttribute('role','alertdialog');card.setAttribute('aria-modal','true');const h=host.createElement('h3');h.textContent=duplicate?'Document Already Exists':'Saved Successfully';const msg=host.createElement('p');msg.textContent=duplicate?'CIPL '+reference+' already exists. Overwrite it?':'CIPL '+reference+' saved online.';const actions=host.createElement('div');actions.style.cssText='display:flex;gap:9px;justify-content:flex-end;margin-top:24px';const done=v=>{veil.remove();resolve(v)};for(const [label,value] of (duplicate?[['Cancel',false],['Overwrite',true]]:[['OK',true]])){const b=host.createElement('button');b.textContent=label;b.style.cssText='background:#83d9cc;color:#102d2a;border:0;border-radius:18px;padding:10px 20px';b.onclick=()=>done(value);actions.append(b)}card.append(h,msg,actions);veil.append(card);host.body.append(veil)})}
async function save(){if(saving||!user)return;const reference=String(state.fields.reference||'').trim();if(!reference||reference===refPrefix('CIPL',state.fields.date))return alert('Enter the CIPL reference');if(!business().id)return alert('Select Business Profile');saving=true;try{
 if(docId){const old=await getDoc(doc(db,'documents',docId));if(!old.exists()||old.data().number!==reference)docId=null}
 if(!docId){const matches=await getDocs(query(collection(db,'documents'),where('number','==',reference),limit(100)));const existing=matches.docs.find(x=>x.data().profileId===business().id&&x.data().documentType==='Commercial Invoice / Packing List');if(existing){if(!await dialog(reference,true))return;docId=existing.id}}
 const ref=docId?doc(db,'documents',docId):doc(collection(db,'documents'));const prior=await getDoc(ref),snapshot=business();
 await setDoc(ref,{templateSource:'preset',templateFamily:'commercial-invoice-packing-list',templateId:'standard',templateVersion:1,documentType:'Commercial Invoice / Packing List',number:reference,date:state.fields.date,presetData:encodePreset(state),profileId:snapshot.id,profileName:snapshot.name||'',companySnapshot:encodePreset(snapshot),presetHeaderSnapshot:encodePreset(header()),updatedAt:serverTimestamp(),updatedBy:user.uid,...(!prior.exists()?{createdAt:serverTimestamp(),createdBy:user.uid,creatorRole:role}:{})},{merge:true});
 docId=ref.id;savedCompany=snapshot;notify('Saved online: '+reference);reportPresetSaved(reference,docId,state.fields.date);ready();await dialog(reference,false)
 }catch(e){notify('Save failed: '+e.message);reportPresetSaveError(e);alert('Save failed: '+e.message)}finally{saving=false}}
window.printDoc=()=>{const old=document.title,ref=String(state.fields.reference||'').replace(/[\\/:*?"<>|]/g,'-');document.title=ref||'CIPL';if(window.parent!==window){const parentTitle=window.parent.document.title;window.parent.document.title=document.title;window.addEventListener('afterprint',()=>window.parent.document.title=parentTitle,{once:true})}render();window.print();window.addEventListener('afterprint',()=>document.title=old,{once:true})};
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.addressMaxLines!==undefined){const lines=e.target.value.replace(/\r\n?/g,'\n').split('\n');if(lines.length>3){const start=e.target.selectionStart;e.target.value=lines.slice(0,3).join('\n');e.target.setSelectionRange(Math.min(start,e.target.value.length),Math.min(start,e.target.value.length))}}if(d.group){const obj=state[d.group];if(!obj)return;if(d.group==='fields'&&d.key==='reference'&&d.referenceSuffix!==undefined)obj.reference=fullReference(refPrefix('CIPL',state.fields.date),e.target.value);else if(d.group==='fields'&&d.key==='date'){obj.date=e.target.value;obj.reference=updateReferenceYear(obj.reference,'CIPL',obj.date);syncReferenceField($('documentFields'),'CIPL',obj.date,obj.reference)}else obj[d.key]=e.target.value;drawRows();render()}else if(d.field){state.fields[d.field]=e.target.value;render()}else if(d.row!==undefined){state.items[Number(d.row)][d.col]=e.target.value;const focus=e.target;const sel=focus.selectionStart;drawRows();const replacement=document.querySelector('[data-row="'+d.row+'"][data-col="'+d.col+'"]');if(replacement){replacement.focus();if(sel!==null)replacement.setSelectionRange(sel,sel)}render()}});
$('movementType').addEventListener('change',e=>{state.movementType=e.target.value==='collection'?'collection':'delivery';const movement=state.movementType;$('addresses').innerHTML=valueInput('address',movement==='delivery'?'Delivery Address':'Collection Address',movement==='delivery'?state.delivery.address:state.collection.address,movement,true);render()});
document.addEventListener('click',e=>{const remove=e.target.closest('[data-remove]');if(remove){state.items.splice(Number(remove.dataset.remove),1);if(!state.items.length)state.items.push(emptyRow());drawRows();render();return}if(e.target.id==='addRow'){state.items.push(emptyRow());drawRows();render()}else if(e.target.id==='removeRow'){if(state.items.length>1)state.items.pop();drawRows();render()}else if(e.target.id==='newBtn')fresh();else if(e.target.id==='saveBtn')save();else if(e.target.id==='printBtn')window.printDoc()});
$('businessSelect').addEventListener('change',e=>{if(docId)return;profile=profiles.find(p=>p.id===e.target.value)||profile;draw();ready()});
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent||e.data?.type!=='docsystem-preset-command')return;const a=e.data.action;if(a==='new')fresh();else if(a==='save')save();else if(a==='print')window.printDoc();else if(a==='business'&&!docId){profile=profiles.find(p=>p.id===e.data.profileId)||profile;draw();ready()}else if(a==='view')render()});
onAuthStateChanged(auth,async u=>{user=u;if(!u){notify('Sign in from DocSystem first');return}try{const usr=await getDoc(doc(db,'users',u.uid));role=usr.data()?.role||'user'}catch(e){}try{const settingsSnap=await getDoc(doc(db,'appSettings','main'));const settings=settingsSnap.data()?.settings||{};profiles=(settings.profiles||[]).filter(p=>p?.company);globals=settings.globalPlaceholders||{};profile=profiles.find(p=>p.id===settings.activeProfileId)||profiles[0]||null;state=blank();if(docId)await loadSaved(docId);else{draw();notify('CIPL ready');ready()}}catch(e){notify('CIPL load failed: '+e.message)}});
window.addEventListener('resize',fitPreview);
</script></body></html>
