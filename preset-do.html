<style>

rd img{max-width:100%;height:110px;object-fit:contain;display:block;margin:6px auto}.muted{color:#65758a;font-size:12px}.preview-column{min-width:0}.preview-header{display:flex;justify-content:space-between;padding:13px 4px 6px}.paper{width:210mm;min-height:297mm;padding:12mm 13mm 13mm;background:white;color:black;box-shadow:0 4px 15px #0002;margin:0 auto 16px;font:8pt Arial,sans-serif}.dt-head{display:grid;grid-template-columns:58% 42%;min-height:48mm;gap:3mm}.dt-ident{min-width:0}.dt-ident .preset-header-slot{line-height:1.3}.dt-ident img{display:block;max-height:24mm;object-fit:contain;margin-bottom:1mm}.dt-ident .preset-header-slot:nth-child(2){font-weight:bold}.dt-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;padding-right:3mm}.dt-title{color:#d6a900;font-size:15pt;font-weight:bold;text-align:right;white-space:pre-wrap}.dt-meta{margin-top:9mm;font-size:7.5pt;width:57mm}.dt-meta-line{display:grid;grid-template-columns:25mm minmax(0,1fr);gap:1.5mm;line-height:1.5}.dt-meta-line b{text-align:right}.dt-section{margin:3mm 0 4mm;border:1px solid #444;break-inside:avoid}.dt-section-title,.dt-table-title{background:#000;color:white;text-align:center;font-weight:bold;padding:1.1mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}.dt-info{display:grid;grid-template-columns:58% 42%;min-height:27mm}.dt-info>div{position:relative;min-width:0;display:flex;flex-direction:column}.dt-info>div:first-child{border-right:1px solid #444;--label-width:20mm}.dt-info>div:last-child{--label-width:24mm}.dt-info>div:before{content:"";position:absolute;left:var(--label-width);top:0;bottom:0;border-left:1px solid #999}.dt-row{display:grid;grid-template-columns:var(--label-width) minmax(0,1fr);min-height:4mm;line-height:1.3}.dt-row b{text-align:right;padding:1mm 1.2mm}.dt-row span{padding:1mm 1.5mm;white-space:pre-wrap;overflow-wrap:anywhere}.dt-row.address{flex:1;min-height:15mm}.dt-items{table-layout:fixed;font-size:8pt}.dt-items th{background:#000;color:white;text-align:center;border:1px solid #555;-webkit-print-color-adjust:exact;print-color-adjust:exact}.dt-items td{border:1px solid #888;height:8mm;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere}.dt-items .quantity{text-align:center}.dt-total{display:flex;justify-content:flex-end;margin:2mm 0 4mm}.dt-total div{width:44mm;border:1px solid #555;display:grid;grid-template-columns:1fr 15mm}.dt-total b,.dt-total span{padding:2mm}.dt-total span{text-align:right;border-left:1px solid #555}.dt-sign{margin:4mm 0 6mm;table-layout:fixed;font-size:7.5pt}.dt-sign th{background:#000;color:white;border:1px solid #111;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}.dt-sign td{border:1px solid #888;padding:1.6mm;white-space:pre-wrap;vertical-align:top;height:17mm}.dt-sign td.role{background:#000;color:#fff;font-weight:bold;text-align:center;vertical-align:middle;-webkit-print-color-adjust:exact;print-color-adjust:exact}.dt-photos{table-layout:fixed}.dt-photos th{background:#000;color:#fff;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}.dt-photos td{border:1px solid #888;text-align:center;vertical-align:middle;height:38mm;width:50%;padding:2mm}.dt-photos img{max-width:100%;max-height:34mm;object-fit:contain}.dt-photos .blank-photo{font-size:8pt;color:#888}body.embedded header,body.embedded .bar{display:none}body.embedded{background:transparent}body.embedded .workspace{padding:0 2px 10px}
@media(max-width:1100px){.workspace{grid-template-columns:1fr}.paper{max-width:100%}}@media(max-width:690px){.fields,.section-fields,.sign-editor,.photo-editor{grid-template-columns:1fr}.paper{zoom:.72;max-width:none}}

</style></head><body><header><h2>Delivery Ticket Preset</h2></header><div class="bar"><button id="newBtn">New</button><button id="saveBtn" class="primary">Save Online</button><button id="printBtn">Print / PDF</button><small id="status">Loading…</small></div><div class="workspace"><div class="editor">
<section class="card"><h3>Delivery Ticket Details</h3><div class="fields" id="documentFields"></div></section>
<section class="card"><h3>Collection Address &amp; Contact Person</h3><div class="section-fields" id="collectionFields"></div></section>
<section class="card"><h3>Deliver To</h3><div class="section-fields" id="deliverToFields"></div></section>
<section class="card"><h3>Delivery Items</h3><div class="table-wrap"><table class="items" id="itemEditor"></table></div><p class="muted">Total Qty: <strong id="qtyTotal">0</strong></p><button id="addRow">+ Add Item</button> <button id="removeRow">Remove Last</button></section>
<section class="card"><h3>Signatures</h3><div id="signatureFields" class="sign-editor"></div></section>
<section class="card"><h3>Photos</h3><p class="muted">10 photo spaces, two columns as in the Excel. Images are resized before saving in the document.</p><div id="photoFields" class="photo-editor"></div></section>
</div><div class="preview-column"><div class="preview-header"><strong>Live A4 Preview</strong><small id="pageCount"></small></div><div id="paper"></div></div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,collection,query,where,limit,getDocs,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
import {paginatePresetDocument} from './preset-pagination.js?v=20261101-single-controller1';
import {sharedPresetSlot,expandPresetText} from './preset-shared.js?v=20261101-common2';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=initializeApp({apiKey:"AIzaSyDPIAoqy9mbWU-4M4kPK9mfSjtVSSA2gI8",authDomain:"docsystem-c29ec.firebaseapp.com",projectId:"docsystem-c29ec",storageBucket:"docsystem-c29ec.firebasestorage.app",messagingSenderId:"25451628479",appId:"1:25451628479:web:ec00096fc84d744c48c30a"});
const auth=getAuth(app),db=getFirestore(app),params=new URLSearchParams(location.search);
if(params.get('embedded')==='1')document.body.classList.add('embedded');
let user=null,role='user',profiles=[],profile=null,globals={},template=null,state=null,docId=params.get('docId')||null,savedCompany=null,savedHeader=null,busy=false,loaded=false;
const posted=(type,data={})=>{if(window.parent!==window)window.parent.postMessage({type:'docsystem-preset-'+type,...data},location.origin)};
function notify(message){$('status').textContent=message;posted('status',{status:message})}
function business(){const c=profile?.company||{};return savedCompany||{id:profile?.id||'',name:c.name||'',logo:c.logo||'',info:(typeof c.headerText==='string'&&c.headerText.trim())?c.headerText:(c.fields||[]).filter(x=>x?.value&&x.place!=='footer').map(x=>(x.label?x.label+': ':'')+x.value).join('\n'),placeholders:globals}}
function header(){return savedHeader||profile?.presetHeader||{}}
function text(v){return expandPresetText(v,{...business(),documentTitle:'DELIVERY TICKET',documentNumber:state?.fields?.reference,documentDate:state?.fields?.date},globals)}
function empty(){return {fields:{date:new Date().toISOString().slice(0,10),reference:'',poDate:'',poNumber:''},collection:{company:'{companyName}',address:'',contact:'',tel:'',email:''},deliverTo:{company:'',address:'',contact:'',tel:'',email:''},items:Array.from({length:10},(_,i)=>({no:String(i+1),description:'',serialNumber:'',unit:'',qty:''})),signatures:Object.fromEntries(['Prepared By','Transported By','Received By'].map(x=>[x,{name:'',position:'',contactNumber:'',companyName:x==='Prepared By'?'{companyName}':'',date:''}])),photos:Array(10).fill('')}}
function field(label,key,value,type='text',group='fields'){
 const isArea=type==='multiline';
 return '<label class="'+(isArea?'address':'')+'">'+esc(label)+(isArea?'<textarea data-group="'+group+'" data-key="'+key+'" rows="4" placeholder="Address line 1&#10;Address line 2&#10;Address line 3">'+esc(value||'')+'</textarea>':'<input type="'+(type==='date'?'date':type==='email'?'email':type==='tel'?'tel':'text')+'" data-group="'+group+'" data-key="'+key+'" value="'+esc(value||'')+'">')+'</label>';
}
function draw(){
 if(!state)return;
 $('documentFields').innerHTML=template.fields.map(f=>field(f.label,f.key,state.fields[f.key],f.type,'fields')).join('');
 for(const section of template.sections)$(section.id==='collection'?'collectionFields':'deliverToFields').innerHTML=section.fields.map(f=>field(f.label,f.key,state[section.id][f.key],f.type,section.id)).join('');
 drawItems();
 $('signatureFields').innerHTML=template.signatures.roles.map(role=>{const d=state.signatures[role]||{};return '<fieldset><legend>'+esc(role)+'</legend>'+[['Name','name'],['Position','position'],['Contact Number','contactNumber'],['Company Name','companyName'],['Date','date']].map(([title,key])=>field(title,key,d[key],key==='date'?'date':'text','sign:'+role)).join('')+'</fieldset>'}).join('');
 $('photoFields').innerHTML=state.photos.map((src,i)=>'<div class="photo-card"><strong>Photo '+(i+1)+'</strong>'+(src?'<img alt="Photo '+(i+1)+'" src="'+esc(src)+'">':'')+'<input type="file" accept="image/*" data-photo="'+i+'">'+(src?'<button data-clear-photo="'+i+'">Remove photo</button>':'')+'</div>').join('');
 render();
}
function drawItems(){
 const cols=template.items.columns;
 $('itemEditor').innerHTML='<thead><tr>'+cols.map(c=>'<th>'+esc(c.label)+'</th>').join('')+'<th></th></tr></thead><tbody>'+state.items.map((row,i)=>'<tr>'+cols.map(c=>'<td>'+(c.type==='multiline'?'<textarea data-row="'+i+'" data-col="'+c.key+'">'+esc(row[c.key])+'</textarea>':'<input type="'+(c.type==='number'?'number':'text')+'" step="any" data-row="'+i+'" data-col="'+c.key+'" value="'+esc(row[c.key])+'">')+'</td>').join('')+'<td><button class="remove" data-remove-row="'+i+'">×</button></td></tr>').join('')+'</tbody>';
 $('qtyTotal').textContent=qtyTotal();
}
function qtyTotal(){return state.items.reduce((n,row)=>n+(Number(row.qty)||0),0).toLocaleString('en-MY',{maximumFractionDigits:3})}
function formatDate(v){if(!v)return '';const d=new Date(v+'T12:00:00');return Number.isNaN(d.getTime())?v:d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function render(){
 if(!state||!template||busy)return;busy=true;
 try{
 const co=business(),head={...co,documentTitle:'DELIVERY TICKET',documentNumber:state.fields.reference,documentDate:state.fields.date};
 const h=header(),meta=[['Date',formatDate(state.fields.date)],['Reference No',state.fields.reference],['Purchase Order Date',formatDate(state.fields.poDate)],['Purchase Order No',state.fields.poNumber]];
 const color=/^#[0-9a-fA-F]{6}$/.test(h.titleColor||'')?h.titleColor:'#d6a900';
 const size=Math.max(8,Math.min(36,Number(h.titleSize)||16));
 const font=['Arial','Georgia','Verdana','Tahoma','Times New Roman','Courier New'].includes(h.titleFont)?h.titleFont:'Arial';
 const title='<div class="dt-title" style="font-family:'+font+';font-size:'+size+'pt;color:'+color+'">DELIVERY TICKET</div>';
 const headerHtml='<div class="dt-head"><div class="dt-ident">'+sharedPresetSlot('logo',head,h,globals)+sharedPresetSlot('name',head,h,globals)+sharedPresetSlot('details',head,h,globals)+'</div><div class="dt-right">'+title+'<div class="dt-meta">'+meta.map(([k,v])=>'<div class="dt-meta-line"><b>'+esc(k)+':</b><span>'+esc(v||'')+'</span></div>').join('')+'</div></div></div>';
 const information=section=>{
  const f=state[section.id];
  const row=(label,value,cl='')=>'<div class="dt-row '+cl+'"><b>'+esc(label)+':</b><span>'+esc(text(value||''))+'</span></div>';
  return '<section class="dt-section"><div class="dt-section-title">'+esc(section.title)+'</div><div class="dt-info"><div>'+row('Company',f.company)+row('Address',f.address,'address')+'</div><div>'+row('Contact Person',f.contact)+row('Tel',f.tel)+row('Email',f.email)+'</div></div></section>'
 };
 const cols=template.items.columns;
 const items='<table class="dt-items excel-table"><colgroup><col style="width:7%"><col style="width:41%"><col style="width:24%"><col style="width:12%"><col style="width:16%"></colgroup><thead><tr>'+cols.map(c=>'<th>'+esc(c.label)+'</th>').join('')+'</tr></thead><tbody>'+state.items.map(r=>'<tr>'+cols.map(c=>'<td class="'+(c.key==='qty'?'quantity':'')+'">'+esc(text(r[c.key]||''))+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
 const total='<div class="dt-total"><div><b>Total Qty</b><span>'+esc(qtyTotal())+'</span></div></div>';
 const sign='<table class="dt-sign"><colgroup><col style="width:14%"><col style="width:26%"><col style="width:16%"><col style="width:19%"><col style="width:12%"><col style="width:13%"></colgroup><thead><tr><th></th>'+template.signatures.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+template.signatures.roles.map(role=>{const d=state.signatures[role]||{};return '<tr><td class="role">'+esc(role)+'</td><td>Name: '+esc(text(d.name))+'\nPosition: '+esc(text(d.position))+'</td><td>'+esc(text(d.contactNumber))+'</td><td>'+esc(text(d.companyName))+'</td><td>'+esc(formatDate(d.date))+'</td><td></td></tr>'}).join('')+'</tbody></table>';
 const photos='<table class="dt-photos excel-table"><thead><tr><th colspan="2">Photos</th></tr></thead><tbody>'+Array.from({length:5},(_,i)=>'<tr>'+[0,1].map(col=>{const idx=i*2+col,src=state.photos[idx];return '<td>'+(src?'<img src="'+esc(src)+'" alt="Photo '+(idx+1)+'">':'<span class="blank-photo">Photo '+(idx+1)+'</span>')+'</td>'}).join('')+'</tr>').join('')+'</tbody></table>';
 $('paper').innerHTML='<article class="paper">'+headerHtml+template.sections.map(information).join('')+items+total+sign+photos+'</article>';
 const pages=paginatePresetDocument($('paper'),{fit:'normal'});
 $('pageCount').textContent=pages+' page(s)';
 fitPreview();posted('height',{height:document.documentElement.scrollHeight+8});
 }finally{busy=false}
}
function fitPreview(){const h=document.querySelector('.preview-column');const available=h?.clientWidth||800;const zoom=Math.min(1,(available-12)/(210*96/25.4));$('paper').querySelectorAll('.paper').forEach(p=>p.style.zoom=String(Math.round(zoom*1000)/1000))}
function newDoc(){docId=null;savedCompany=null;savedHeader=null;state=empty();draw();notify('New Delivery Ticket');ready()}
async function save(){
 if(!user)return alert('Please sign in first');
 if(!String(state.fields.reference||'').trim())return alert('Enter Reference No. before saving');
 if(!business().id)return alert('Choose a Business Profile');
 try{
  if(!docId){const q=await getDocs(query(collection(db,'documents'),where('number','==',state.fields.reference.trim()),limit(100)));if(q.docs.some(d=>d.data().templateFamily==='delivery-ticket'&&d.data().profileId===business().id))return alert('This Delivery Ticket reference already exists for this Business Profile')}
  const ref=docId?doc(db,'documents',docId):doc(collection(db,'documents'));
  const before=await getDoc(ref);
  const payload={templateSource:'preset',templateFamily:'delivery-ticket',templateId:'standard',templateVersion:1,documentType:'Delivery Ticket',number:state.fields.reference.trim(),date:state.fields.date||'',presetData:state,profileId:business().id,companySnapshot:business(),presetHeaderSnapshot:savedHeader||structuredClone(profile?.presetHeader||{}),updatedAt:serverTimestamp(),updatedBy:user.uid,...(!before.exists()?{createdAt:serverTimestamp(),createdBy:user.uid,creatorRole:role}:{})};
  await setDoc(ref,payload,{merge:true});docId=ref.id;savedCompany=business();notify('Saved Delivery Ticket '+state.fields.reference);ready();
 }catch(e){alert('Delivery Ticket save failed: '+e.message)}
}
async function loadSaved(id){
 try{const snap=await getDoc(doc(db,'documents',id));if(!snap.exists())throw Error('Not found');const d=snap.data();if(d.templateFamily!=='delivery-ticket')throw Error('Not a Delivery Ticket');docId=id;state=d.presetData;savedCompany=d.companySnapshot||null;savedHeader=d.presetHeaderSnapshot||null;profile=profiles.find(x=>x.id===d.profileId)||profile;draw();notify('Opened Delivery Ticket '+d.number);ready()}catch(e){notify('Open failed: '+e.message)}
}
function ready(){posted('ready',{profiles:profiles.map(p=>({id:p.id,name:p.company?.name||'Business'})),selected:business().id,locked:!!docId,status:$('status').textContent})}
function chooseBusiness(id){if(docId){ready();return}const selected=profiles.find(x=>x.id===id);if(selected){profile=selected;draw();ready()}}
window.printDoc=()=>{render();window.print()};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent||e.data?.type!=='docsystem-preset-command')return;const {action}=e.data;if(action==='new')newDoc();else if(action==='save')save();else if(action==='print')window.printDoc();else if(action==='business')chooseBusiness(e.data.profileId);else if(action==='view')render()});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.group){const obj=d.group.startsWith('sign:')?(state.signatures[d.group.slice(5)]??={}):state[d.group];if(obj)obj[d.key]=e.target.value;render()}else if(d.row!==undefined){state.items[Number(d.row)][d.col]=e.target.value;$('qtyTotal').textContent=qtyTotal();render()}});
document.addEventListener('click',e=>{if(e.target.id==='newBtn')newDoc();else if(e.target.id==='saveBtn')save();else if(e.target.id==='printBtn')window.printDoc();else if(e.target.id==='addRow'){state.items.push({no:String(state.items.length+1),description:'',serialNumber:'',unit:'',qty:''});drawItems();render()}else if(e.target.id==='removeRow'){if(state.items.length>1){state.items.pop();drawItems();render()}}else if(e.target.dataset.removeRow!==undefined){state.items.splice(Number(e.target.dataset.removeRow),1);if(!state.items.length)state.items.push({no:'1',description:'',serialNumber:'',unit:'',qty:''});drawItems();render()}else if(e.target.dataset.clearPhoto!==undefined){state.photos[Number(e.target.dataset.clearPhoto)]='';draw()}});
document.addEventListener('change',async e=>{
 if(e.target.dataset.photo===undefined)return;const file=e.target.files?.[0];if(!file)return;
 if(!file.type.startsWith('image/'))return alert('Please choose an image');
 try{
  const bmp=await createImageBitmap(file);const max=650,scale=Math.min(1,max/Math.max(bmp.width,bmp.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bmp.width*scale);canvas.height=Math.round(bmp.height*scale);canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);bmp.close();
  const uri=canvas.toDataURL('image/jpeg',0.65);
  if(uri.length>85000)return alert('Image is too large after resizing');
  state.photos[Number(e.target.dataset.photo)]=uri;draw();
 }catch(err){alert('Could not process photo: '+err.message)}
});
async function start(){
 try{const response=await fetch('./templates/do/standard.json',{cache:'no-store'});if(!response.ok)throw Error('Delivery Ticket JSON not found');template=await response.json();state=empty();loaded=true;draw();if(docId)await loadSaved(docId);else{notify('Delivery Ticket ready');ready()}}catch(e){notify('Cannot load Delivery Ticket: '+e.message)}
}
onAuthStateChanged(auth,async u=>{user=u;if(!u){notify('Sign in to DocSystem first');return}try{const p=await getDoc(doc(db,'users',u.uid));role=p.data()?.role||'user'}catch{}try{const snap=await getDoc(doc(db,'appSettings','main'));const st=snap.data()?.settings||{};globals=st.globalPlaceholders||{};profiles=Array.isArray(st.profiles)?st.profiles.filter(p=>p?.company):[];profile=profiles.find(p=>p.id===st.activeProfileId)||profiles[0]||null;if(!loaded)await start();else{render();ready()}}catch(e){notify('Business Profiles failed: '+e.message)}});
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>{fitPreview();posted('height',{height:document.documentElement.scrollHeight+8})}).observe(document.querySelector('.workspace'));
</script></body></html>
