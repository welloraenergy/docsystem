function amountWords(amount){
 const singles=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
 const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
 function under1000(n){
  let out=[];if(n>=100){out.push(singles[Math.floor(n/100)]+' hundred');n%=100}
  if(n>=20){out.push(tens[Math.floor(n/10)]+(n%10?'-'+singles[n%10]:''))}
  else if(n>0)out.push(singles[n]);
  return out.join(' ');
 }
 function integer(n){
  if(!n)return 'zero';
  let out=[];for(const [v,label] of [[1000000000,'billion'],[1000000,'million'],[1000,'thousand'],[1,'']]){
   const group=Math.floor(n/v);if(group){out.push(under1000(group)+(label?' '+label:''));n%=v}
  }return out.join(' ');
 }
 const currency=currencySymbol()==='USD'?'US dollars':'Malaysian ringgit',minor=currencySymbol()==='USD'?'cents':'sen';
 const centsTotal=Math.round(Math.max(0,Number(amount)||0)*100);
 const major=Math.floor(centsTotal/100),cents=centsTotal%100;
 if(major>999999999999)return money(amount)+' '+currency;
 return integer(major)+' '+currency+(cents?' and '+integer(cents)+' '+minor:' only');
}

function parseInvoiceDate(value){

 if(!raw)return '';
 const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(raw);
 if(!m)return null;
 const d=+m[1],mo=+m[2],y=+m[3],check=new Date(y,mo-1,d);
 if(check.getDate()!==d||check.getMonth()!==mo-1||check.getFullYear()!==y)return null;
