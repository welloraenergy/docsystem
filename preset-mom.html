 if(docId){const source=await getDoc(doc(db,'documents',docId));if(!source.exists()||String(source.data().number||'').trim()!==state.reference.trim())docId=null;}
 if(!docId){
  const hits=await getDocs(query(collection(db,'documents'),where('number','==',state.reference.trim()),limit(100)));
  const duplicate=hits.docs.find(x=>x.data().profileId===co.id&&(x.data().templateFamily===family||x.data().documentType==='Minutes of Meeting'));if(duplicate){if(!await documentSaveMessage(state.reference,true))return;docId=duplicate.id}
 }
 const ref=docId?doc(db,'documents',docId):doc(collection(db,'documents')),old=await getDoc(ref);
 const savedDate=state.date;
 if(isDraft&&old?.exists()&&old.data().isDraft!==true&&old.data().locked!==false)throw Error('Unlock the existing saved document before converting it to a draft.');
 await setDoc(ref,{isDraft,...(!old?.exists()&&isDraft?{locked:false}:old?.data()?.isDraft===true&&!isDraft?{locked:true}:{}),templateSource:'preset',templateFamily:family,templateId:'standard',templateVersion:1,documentType:'Minutes of Meeting',number:state.reference,date:savedDate,presetData:encodePreset((workspaceSubmittedSnapshot=JSON.stringify(state),state)),profileId:co.id,profileName:co.name||'',companySnapshot:encodePreset(co),presetHeaderSnapshot:encodePreset(profile?.presetHeader||headSnapshot||{}),updatedAt:serverTimestamp(),updatedBy:user.uid,...(!old.exists()?{createdAt:serverTimestamp(),createdBy:user.uid,creatorRole:role}:{})},{merge:true});
 // Do not claim online success until the same Firestore document can be read back.
 const verified=await getDoc(ref);
 if(!verified.exists()||verified.data().number!==state.reference||verified.data().templateFamily!==family||verified.data().isDraft!==isDraft)
   throw Error('Save verification failed: the expected document was not found in Firebase.');
 docId=ref.id;recordSnapshot=co;notice('Saved and verified online: '+state.reference);
 $('documentDraft').checked=isDraft;workspaceSavedSnapshot=workspaceSubmittedSnapshot;reportPresetSaved(state.reference,docId,savedDate);post('dirty',{dirty:JSON.stringify(state)!==workspaceSavedSnapshot});await documentSaveMessage(state.reference);
 }catch(e){notice('Save failed: '+(e.code||e.message));reportPresetSaveError(e)}
}
async function openSaved(){
 try{const snap=await getDoc(doc(db,'documents',docId));if(!snap.exists())throw Error('Document not found');const d=snap.data();if(d.templateFamily!==family)throw Error('Different document family');$('documentDraft').checked=d.isDraft===true&&params.get('duplicate')!=='1';state={...defaults(),...decodePreset(d.presetData)};workspaceSavedSnapshot=null;recordSnapshot=decodePreset(d.companySnapshot||null);headSnapshot=decodePreset(d.presetHeaderSnapshot||null);profile=profiles.find(x=>x.id===d.profileId)||profile;if(params.get('duplicate')==='1'){docId=null;state.reference=refPrefix(code,referenceDate());redraw();notice('Duplicate ready. Enter a new '+title+' reference.')}else{redraw();notice('Opened '+d.number)}ready()}catch(e){notice('Cannot open saved document: '+e.message)}
}
function ready(){
 if(!docId||workspaceSavedSnapshot===null)workspaceSavedSnapshot=docId?JSON.stringify(state):null;post('ready',{profiles:profiles.map(p=>({id:p.id,name:p.company?.name||'Business'})),selected:currentBusiness().id,locked:!!docId,dirty:workspaceSavedSnapshot!==null&&JSON.stringify(state)!==workspaceSavedSnapshot,isDraft:$('documentDraft').checked,status:$('status').textContent})}
function newDoc(){$('documentDraft').checked=false;docId=null;recordSnapshot=null;headSnapshot=null;state=defaults();redraw();notice('New '+title);ready()}
window.printDoc=()=>{const ref=(state.reference||title).replace(/[\\/:*?"<>|]/g,'-');document.title=ref;if(window.parent!==window){const previous=window.parent.document.title;window.parent.document.title=ref;window.addEventListener('afterprint',()=>window.parent.document.title=previous,{once:true})}document.body.classList.add('printing');renderDocument();window.print()};
window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.paymentDateDisplay!==undefined||d.paymentDatePicker!==undefined)return;if(d.field){if(d.field==='reference'&&e.target.dataset.referenceSuffix)state.reference=fullReference(refPrefix(code,referenceDate()),e.target.value);else{state[d.field]=e.target.value;if(d.field==='date'){state.reference=updateReferenceYear(state.reference,code,referenceDate());syncReferenceField($('formFields'),code,referenceDate(),state.reference)}}renderDocument()}else if(d.attendance){state[d.attendance][Number(d.index)]=e.target.value;renderDocument()}else if(d.array){state[d.array][Number(d.index)][d.key]=e.target.value;renderDocument()}else if(d.sign){state.signatures[d.sign][d.signKey]=e.target.value;renderDocument()}});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.toggle){state[d.toggle]=e.target.checked;redraw();return}if(d.paymentDateDisplay===undefined&&d.paymentDatePicker===undefined)return;const iso=d.paymentDateDisplay!==undefined?parseDateDisplay(e.target.value):e.target.value;if(iso===null){e.target.setCustomValidity('Enter a valid date as DD/MM/YYYY');e.target.reportValidity();return}e.target.setCustomValidity('');const host=e.target.closest('.payment-date-control');host.querySelector('[data-payment-date-display]').value=iso?iso.slice(8)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';host.querySelector('[data-payment-date-picker]').value=iso;if(d.sign){state.signatures[d.sign]??={};state.signatures[d.sign][d.signKey]=iso}else if(d.field){state[d.field]=iso;if(d.field==='date'){state.reference=updateReferenceYear(state.reference,code,state.date);syncReferenceField($('formFields'),code,referenceDate(),state.reference)}}renderDocument()});
document.addEventListener('click',e=>{const open=e.target.closest('[data-payment-open-date]');if(open){const picker=open.closest('.payment-date-control').querySelector('[data-payment-date-picker]');if(picker.showPicker)picker.showPicker();else picker.click();return}const b=e.target;if(b.id==='addItem'){state.items.push({discussion:'',action:'',pic:'',dueDate:''});redraw()}if(b.id==='removeLast'&&state.items.length>1){state.items.pop();redraw()}if(b.dataset.removeItem!==undefined&&state.items.length>1){state.items.splice(Number(b.dataset.removeItem),1);redraw()}if(b.dataset.addAttendance){state[b.dataset.addAttendance].push('');redraw()}if(b.dataset.removeAttendance){const list=state[b.dataset.removeAttendance];list.splice(Number(b.dataset.index),1);if(!list.length)list.push('');redraw()}});
$('newBtn').onclick=()=>{if(confirm('Clear all fields and start a new document?'))newDoc()};$('saveBtn').onclick=save;$('printBtn').onclick=window.printDoc;
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent||e.data?.type!=='docsystem-preset-command')return;const a=e.data.action;if(a==='new')newDoc();if(a==='draft'){$('documentDraft').checked=e.data.isDraft===true;return} if(a==='save'){$('documentDraft').checked=e.data.isDraft===true;save();}if(a==='print')window.printDoc();if(a==='view'){document.body.classList.toggle('printing',!!e.data.preview);renderDocument()}if(a==='refresh-header'){(async()=>{try{const selectedId=profile?.id;const latest=await getDoc(doc(db,'appSettings','main'));if(!latest.exists())throw Error('Business settings not found');const settings=latest.data()?.settings||{};globalPlaceholders=settings.globalPlaceholders||{};profiles=(settings.profiles||[]).filter(p=>p?.company);profile=profiles.find(p=>p.id===selectedId)||profile;renderDocument();notice(title+' header updated from shared settings')}catch(error){notice('Unable to refresh '+title+' header: '+error.message)}})();return}if(a==='business'&&!docId){profile=profiles.find(p=>p.id===e.data.profileId)||profile;redraw();ready()}});
onAuthStateChanged(auth,async u=>{user=u;if(!u){notice('Sign in from DocSystem first');return}try{const x=await getDoc(doc(db,'users',u.uid));role=x.data()?.role||'user'}catch{}try{const x=await getDoc(doc(db,'appSettings','main')),settings=x.data()?.settings||{};globalPlaceholders=settings.globalPlaceholders||{};profiles=(settings.profiles||[]).filter(p=>p?.company);profile=profiles.find(p=>p.id===settings.activeProfileId)||profiles[0];if(docId)await openSaved();else{redraw();notice(title+' ready');ready()}}catch(e){notice('Unable to load Business Profiles: '+e.message)}});

</script></body></html>
