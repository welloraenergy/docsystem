 const info='<div class="grn-section"><div class="grn-section-title">Delivery To Information</div><div class="grn-client"><div><table class="grn-info"><tbody><tr><th>Delivery To:</th><td>'+esc(expanded(state.deliveryTo.company))+'</td></tr><tr class="grn-address-row"><th>Address:</th><td><span class="grn-address-lines">'+esc(expanded(state.deliveryTo.address))+'</span></td></tr></tbody></table></div><div><table class="grn-info"><tbody><tr><th>Contact:</th><td>'+esc(state.deliveryTo.contact)+'</td></tr><tr><th>Telephone:</th><td>'+esc(state.deliveryTo.phone)+'</td></tr><tr><th>Email:</th><td>'+esc(state.deliveryTo.email)+'</td></tr><tr class="grn-filler"><th></th><td></td></tr></tbody></table></div></div></div>';
 const freightRow='<tr><th>Freight Agent / Transport Company:</th><td>'+esc(expanded(state.fields.freightAgent))+'</td></tr>';
 const collectionInfo=state.showCollection?'<div class="grn-section"><div class="grn-section-title">Collection Information</div><table class="grn-info"><tbody><tr><th>Collection Address:</th><td><span class="grn-address-lines">'+esc(expanded(state.collection.address))+'</span></td></tr>'+freightRow+'</tbody></table></div>':'';
 const bill=state.billTo||{company:'',address:'',contact:'',phone:'',email:''};
 const billToInfo=state.showBillTo?'<div class="grn-section"><div class="grn-section-title">Bill To</div><div class="grn-client"><div><table class="grn-info"><tbody><tr><th>Bill To:</th><td>'+esc(expanded(bill.company))+'</td></tr><tr class="grn-address-row"><th>Address:</th><td><span class="grn-address-lines">'+esc(expanded(bill.address))+'</span></td></tr></tbody></table></div><div><table class="grn-info"><tbody><tr><th>Contact:</th><td>'+esc(bill.contact)+'</td></tr><tr><th>Telephone:</th><td>'+esc(bill.phone)+'</td></tr><tr><th>Email:</th><td>'+esc(bill.email)+'</td></tr><tr class="grn-filler"><th></th><td></td></tr></tbody></table></div></div></div>':'';
 const transportInfo='';
 const logistics=collectionInfo+billToInfo+transportInfo;
 const colWidths=[5,73,10,12];
 const table='<table class="excel-table grn-items"><colgroup>'+colWidths.map(w=>'<col style="width:'+w+'%">').join('')+'</colgroup><thead><tr>'+['Item','Description','Unit','Qty'].map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+state.items.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(expanded(r.description||''))+'</td><td>'+esc(r.unit??'')+'</td><td>'+esc(r.qty??'')+'</td></tr>').join('')+'</tbody></table>';
 const total=state.items.reduce((a,r)=>a+amount(r.qty),0);
 const totals='<table class="grn-totals"><colgroup><col style="width:70%"><col style="width:30%"></colgroup><tbody><tr><th scope="row">Total Qty</th><td>'+total.toLocaleString('en-MY',{maximumFractionDigits:6})+'</td></tr></tbody></table>';
 const bottom='<div class="grn-bottom"><div class="grn-panel"><h4>COMMENTS</h4><p>'+esc(expanded(state.fields.comments))+'</p></div></div>';
 const signatureSlots=[['prepared','Signature 1'],['reviewed','Signature 2'],['approved','Signature 3']];
 const sign=signatureSlots.some(([key])=>state.signatureVisibility[key])?'<section class="grn-signatures">'+(state.signatureVisibility.prepared?'<div class="grn-sigheader"><div class="grn-sigtitle">'+esc(expanded(state.prepared.title??''))+'</div><div class="grn-sigstatement">'+esc(expanded(state.prepared.statement??''))+'</div></div>':'')+(signatureSlots.some(([key])=>key!=='prepared'&&state.signatureVisibility[key]&&(state[key].title||state[key].statement))?signatureSlots.map(([key])=>key!=='prepared'&&state.signatureVisibility[key]?'<div class="grn-sigheading"><div class="grn-sigtitle">'+esc(expanded(state[key].title??''))+'</div><div class="grn-sigstatement">'+esc(expanded(state[key].statement??''))+'</div></div>':'<div aria-hidden="true"></div>').join(''):'')+signatureSlots.map(([key])=>state.signatureVisibility[key]?'<div class="grn-sign"><div class="grn-sigline"><div class="grn-sigcaption">'+esc(expanded(state[key].lineLabel??''))+'</div>'+esc(expanded(state[key].belowLine??''))+'</div></div>':'<div class="grn-sign" aria-hidden="true"></div>').join('')+'</section>':'';
 $('paper').innerHTML='<article class="paper">'+company+info+logistics+table+totals+bottom+sign+'</article>';
 paginatePresetDocument($('paper'),{fit:'normal'});
 $('pageCount').textContent=$('paper').querySelectorAll('.paper').length+' page(s)';
 fitPreview();posted('height',{height:document.documentElement.scrollHeight+8});
}
function fitPreview(){const holder=document.querySelector('.preview-column'),width=holder?.clientWidth||window.innerWidth;const zoom=Math.min(1,Math.max(.15,(width-24)/(210*96/25.4)));$('paper').querySelectorAll('.paper').forEach(p=>p.style.zoom=String(Math.round(zoom*1000)/1000))}
function ready(){
 posted('ready',{profiles:profiles.map(p=>({id:p.id,name:p.company?.name||'Business'})),selected:profile?.id||'',locked:!!docId,isDraft:$('documentDraft').checked,status:$('status').textContent})}
function fresh(){$('documentDraft').checked=false;docId=null;savedCompany=null;savedHeader=null;state=blank();draw();notify('New GRN ready');ready()}
async function loadSaved(id){const snap=await getDoc(doc(db,'documents',id));if(!snap.exists())throw Error('Document not found');const data=snap.data();if(data.templateFamily!=='goods-received-note')throw Error('Not a GRN');docId=id;$('documentDraft').checked=data.isDraft===true&&params.get('duplicate')!=='1';state=decodePreset(data.presetData);
 // Existing saved fields are retained without rendering removed columns.

 state.signatureVisibility={prepared:true,reviewed:false,approved:false,...(state.signatureVisibility||{})};
 state.prepared=state.prepared||{name:'',position:'',date:''};
 state.reviewed=state.reviewed||{name:'',position:'',date:''};
 state.approved=state.approved||{name:'',position:'',date:''};
 for(const [key,label] of [['prepared','Signature 1'],['reviewed','Signature 2'],['approved','Signature 3']]){
  if(state[key]?.title===label)state[key].title='';
  const sig=state[key];
  if(sig.title===undefined)sig.title='';
  if(sig.statement===undefined){
   if(key==='prepared'){
    const oldTitle=String(sig.title||'');
    const split=oldTitle.match(/^(Vendor Acknowledgement:?)\s*\n([\s\S]+)$/i);
    if(split){sig.title=split[1];sig.statement=split[2]}
    else{sig.statement=state.fields.certification??'We acknowledge receipt of the above items in good order.';if(!sig.title)sig.title='Vendor Acknowledgement:'}
   }else sig.statement='';
  }
  if(sig.lineLabel===undefined)sig.lineLabel='(Signature & Stamp)';
  if(sig.belowLine===undefined){
   const legacyLines=[sig.name||'',sig.position||'',sig.date||''].filter(Boolean);
   sig.belowLine=legacyLines.length?legacyLines.join('\n'):'Name:\nCompany:\nPosition:\nContact No.:\nDate:';
  }
 }
 delete state.fields.certification;
 state.billTo=state.billTo||{company:'',address:'',contact:'',phone:'',email:''};
 state.collection=state.collection||{address:''};
 if(typeof state.showCollection!=='boolean')state.showCollection=true;
 state.showBillTo=!!state.showBillTo;
 savedCompany=decodePreset(data.companySnapshot||null);savedHeader=decodePreset(data.presetHeaderSnapshot||null);profile=profiles.find(p=>p.id===data.profileId)||profile;if(params.get('duplicate')==='1'){docId=null;state.fields.reference=refPrefix('GRN',state.fields.date);notify('Duplicate ready; enter a new GRN number')}else notify('Opened '+data.number);draw();ready()}
function dialog(reference,duplicate){return new Promise(resolve=>{let host=document;try{if(window.top!==window&&window.top.document?.body)host=window.top.document}catch(e){}const veil=host.createElement('div');veil.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#0009;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px';const card=host.createElement('div');card.style.cssText='background:#192321;color:#fff;padding:24px;border-radius:14px;max-width:540px;width:100%;box-shadow:0 15px 40px #0008;font:15px Arial';card.setAttribute('role','alertdialog');card.setAttribute('aria-modal','true');const h=host.createElement('h3');h.textContent=duplicate?'Document Already Exists':'Saved Successfully';const msg=host.createElement('p');msg.textContent=duplicate?'GRN '+reference+' already exists. Overwrite it?':'GRN '+reference+' saved online.';const actions=host.createElement('div');actions.style.cssText='display:flex;gap:9px;justify-content:flex-end;margin-top:24px';const done=v=>{veil.remove();resolve(v)};for(const [label,value] of (duplicate?[['Cancel',false],['Overwrite',true]]:[['OK',true]])){const b=host.createElement('button');b.textContent=label;b.style.cssText='background:#83d9cc;color:#102d2a;border:0;border-radius:18px;padding:10px 20px';b.onclick=()=>done(value);actions.append(b)}card.append(h,msg,actions);veil.append(card);host.body.append(veil)})}
async function save(){const isDraft=$('documentDraft').checked;if(saving||!user)return;const reference=String(state.fields.reference||'').trim();if(!reference||reference===refPrefix('GRN',state.fields.date))return alert('Enter the GRN reference');if(!business().id)return alert('Select Business Profile');saving=true;try{
 if(docId){const old=await getDoc(doc(db,'documents',docId));if(!old.exists()||old.data().number!==reference)docId=null}
 if(!docId){const matches=await getDocs(query(collection(db,'documents'),where('number','==',reference),limit(100)));const existing=matches.docs.find(x=>x.data().profileId===business().id&&x.data().documentType==='Goods Received Note');if(existing){if(!await dialog(reference,true))return;docId=existing.id}}
 const ref=docId?doc(db,'documents',docId):doc(collection(db,'documents'));const prior=await getDoc(ref),snapshot=business();
 if(isDraft&&prior?.exists()&&prior.data().isDraft!==true&&prior.data().locked!==false)throw Error('Unlock the existing saved document before converting it to a draft.');
 await setDoc(ref,{isDraft,...(!prior?.exists()&&isDraft?{locked:false}:prior?.data()?.isDraft===true&&!isDraft?{locked:true}:{}),templateSource:'preset',templateFamily:'goods-received-note',templateId:'standard',templateVersion:1,documentType:'Goods Received Note',number:reference,date:state.fields.date,presetData:encodePreset(state),profileId:snapshot.id,profileName:snapshot.name||'',companySnapshot:encodePreset(snapshot),presetHeaderSnapshot:encodePreset(header()),updatedAt:serverTimestamp(),updatedBy:user.uid,...(!prior.exists()?{createdAt:serverTimestamp(),createdBy:user.uid,creatorRole:role}:{})},{merge:true});
 docId=ref.id;savedCompany=snapshot;notify('Saved online: '+reference);$('documentDraft').checked=isDraft;reportPresetSaved(reference,docId,state.fields.date);ready();await dialog(reference,false)
 }catch(e){notify('Save failed: '+e.message);reportPresetSaveError(e);alert('Save failed: '+e.message)}finally{saving=false}}
window.printDoc=()=>{const old=document.title,ref=String(state.fields.reference||'').replace(/[\\/:*?"<>|]/g,'-');document.title=ref||'GRN';if(window.parent!==window){const parentTitle=window.parent.document.title;window.parent.document.title=document.title;window.addEventListener('afterprint',()=>window.parent.document.title=parentTitle,{once:true})}render();window.print();window.addEventListener('afterprint',()=>document.title=old,{once:true})};
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.addressMaxLines!==undefined){const lines=e.target.value.replace(/\r\n?/g,'\n').split('\n');if(lines.length>3){const start=e.target.selectionStart;e.target.value=lines.slice(0,3).join('\n');e.target.setSelectionRange(Math.min(start,e.target.value.length),Math.min(start,e.target.value.length))}}if(d.group){const obj=state[d.group];if(!obj)return;if(d.group==='fields'&&d.key==='reference'&&d.referenceSuffix!==undefined)obj.reference=fullReference(refPrefix('GRN',state.fields.date),e.target.value);else if(d.group==='fields'&&d.key==='date'){obj.date=e.target.value;obj.reference=updateReferenceYear(obj.reference,'GRN',obj.date);syncReferenceField($('documentFields'),'GRN',obj.date,obj.reference)}else obj[d.key]=e.target.value;drawRows();render()}else if(d.field){state.fields[d.field]=e.target.value;render()}else if(d.row!==undefined){state.items[Number(d.row)][d.col]=e.target.value;const focus=e.target;const sel=focus.selectionStart;drawRows();const replacement=document.querySelector('[data-row="'+d.row+'"][data-col="'+d.col+'"]');if(replacement){replacement.focus();if(sel!==null)replacement.setSelectionRange(sel,sel)}render()}});

$('showBillTo').addEventListener('change',e=>{state.showBillTo=e.target.checked;const b=state.billTo;$('billToFields').innerHTML=state.showBillTo?valueInput('company','Company',b.company,'billTo')+valueInput('address','Address',b.address,'billTo',true)+valueInput('contact','Contact Person',b.contact,'billTo')+valueInput('phone','Telephone',b.phone,'billTo')+valueInput('email','Email',b.email,'billTo'):'';render()});

$('showCollection').addEventListener('change',e=>{state.showCollection=e.target.checked;$('collectionFields').innerHTML=state.showCollection?valueInput('address','Collection Address',state.collection.address,'collection',true)+valueInput('freightAgent','Freight Agent / Transport Company',state.fields.freightAgent,'fields',false):'';render()});
document.addEventListener('change',e=>{const key=e.target.dataset.signatureVisible;if(!key)return;if(!['prepared','reviewed','approved'].includes(key))return;state.signatureVisibility[key]=e.target.checked;$('signatureFields').innerHTML=[['prepared','Signature 1'],['reviewed','Signature 2'],['approved','Signature 3']].filter(([name])=>state.signatureVisibility[name]).map(([name,label])=>'<div class="grn-sign-fields"><h4>'+label+'</h4>'+valueInput('title','Signature heading',state[name].title,name,true)+valueInput('statement','Acknowledgement statement',state[name].statement,name,true)+valueInput('lineLabel','Signature line label',state[name].lineLabel,name,true)+valueInput('belowLine','Text below signature line (optional)',state[name].belowLine,name,true)+'</div>').join('');render()});
document.addEventListener('click',e=>{const remove=e.target.closest('[data-remove]');if(remove){state.items.splice(Number(remove.dataset.remove),1);if(!state.items.length)state.items.push(emptyRow());drawRows();render();return}if(e.target.id==='addRow'){state.items.push(emptyRow());drawRows();render()}else if(e.target.id==='removeRow'){if(state.items.length>1)state.items.pop();drawRows();render()}else if(e.target.id==='newBtn')fresh();else if(e.target.id==='saveBtn')save();else if(e.target.id==='printBtn')window.printDoc()});
$('businessSelect').addEventListener('change',e=>{if(docId)return;profile=profiles.find(p=>p.id===e.target.value)||profile;draw();ready()});
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent||e.data?.type!=='docsystem-preset-command')return;const a=e.data.action;if(a==='new')fresh();else if(a==='draft'){$('documentDraft').checked=e.data.isDraft===true;return} else if(a==='save'){$('documentDraft').checked=e.data.isDraft===true;save();}else if(a==='print')window.printDoc();else if(a==='business'&&!docId){profile=profiles.find(p=>p.id===e.data.profileId)||profile;draw();ready()}else if(a==='view')render()});
onAuthStateChanged(auth,async u=>{user=u;if(!u){notify('Sign in from DocSystem first');return}try{const usr=await getDoc(doc(db,'users',u.uid));role=usr.data()?.role||'user'}catch(e){}try{const settingsSnap=await getDoc(doc(db,'appSettings','main'));const settings=settingsSnap.data()?.settings||{};profiles=(settings.profiles||[]).filter(p=>p?.company);globals=settings.globalPlaceholders||{};profile=profiles.find(p=>p.id===settings.activeProfileId)||profiles[0]||null;state=blank();if(docId)await loadSaved(docId);else{draw();notify('GRN ready');ready()}}catch(e){notify('GRN load failed: '+e.message)}});
window.addEventListener('resize',fitPreview);
</script></body></html>
