 const available=mobileA4AvailableWidth(holder);
 const scale=Math.min(1,available/(210*96/25.4));
 $('paper').querySelectorAll('.paper').forEach(p=>{p.style.zoom=String(Math.round(scale*1000)/1000)});
}
function newDoc(){if(saving)return;docId=null;savedCompany=null;savedHeader=null;state=activeCopyDefaults?structuredClone(activeCopyDefaults):blank();if(activeCopyDefaults){state.fields.reference='';state.fields.date=new Date().toISOString().slice(0,10)}draw();notify('New Invoice');ready()}
async function save(){
 if(saving)return;if(!user)return alert('Sign in first');if(!String(state.fields.reference||'').trim())return alert('Enter Reference No.');if(!business().id)return alert('Select Business Profile');saving=true;
 try{
  if(!docId){const hits=await getDocs(query(collection(db,'documents'),where('number','==',state.fields.reference.trim()),limit(100)));if(hits.docs.some(x=>x.data().templateFamily==='invoice'&&x.data().profileId===business().id))return alert('Invoice reference exists for this company. Open it instead.')}
  const ref=docId?doc(db,'documents',docId):doc(collection(db,'documents')),prior=await getDoc(ref),snap=business();
  const payload={templateSource:'preset',templateFamily:'invoice',templateId:'standard',templateVersion:1,documentType:'Invoice',number:state.fields.reference.trim(),date:state.fields.date,presetData:state,profileId:snap.id,companySnapshot:snap,presetHeaderSnapshot:savedHeader||structuredClone(profile?.presetHeader||{}),updatedAt:serverTimestamp(),updatedBy:user.uid,...(!prior.exists()?{createdAt:serverTimestamp(),createdBy:user.uid,creatorRole:role}:{})};
  await setDoc(ref,payload,{merge:true});docId=ref.id;savedCompany=snap;notify('Saved Invoice '+state.fields.reference);ready();
 }catch(e){notify('Invoice save failed');alert(e.message)}finally{saving=false}
}
async function loadSaved(id){try{const snapshot=await getDoc(doc(db,'documents',id));if(!snapshot.exists())throw Error('Document not found');const d=snapshot.data();if(d.templateFamily!=='invoice')throw Error('This is not an Invoice');docId=id;state=d.presetData;savedCompany=d.companySnapshot||null;savedHeader=d.presetHeaderSnapshot||null;profile=profiles.find(p=>p.id===d.profileId)||profile;draw();notify('Opened Invoice '+d.number);ready()}catch(e){notify('Cannot open Invoice: '+e.message)}}
function ready(){posted('ready',{profiles:profiles.map(p=>({id:p.id,name:p.company?.name||'Business'})),selected:business().id,locked:!!docId,status:$('status').textContent})}
function chooseBusiness(id){if(docId){ready();return}const found=profiles.find(p=>p.id===id);if(!found)return;profile=found;state.fields.currency=business().defaultCurrency||'MYR';draw();ready()}
window.printDoc=()=>{render();window.print()};

let presetCopyApplied=false,activeCopyDefaults=null;
async function saveAsNewPresetTemplate(name){
 if(new URLSearchParams(location.search).get('configure')!=='1')return;
 if(!user||!state)return alert('Sign in and open a preset first');
 if(!name||!name.trim())return;
 try{
  const saved=await savePresetCopy({user,family:'invoice',basePresetId:'standard',name,state,profileId:business().id});
  notify('Template saved: '+saved.name);
  posted('template-saved',{name:saved.name,id:saved.id});
 }catch(error){alert('Could not save template copy: '+error.message)}
}
async function openSavedPresetCopy(){
 const copyId=params.get('copyId');
 if(presetCopyApplied||!copyId||docId||!user)return;
 try{
  const copy=await readPresetCopy({user,id:copyId,family:'invoice'});
  presetCopyApplied=true;
  docId=null;savedCompany=null;savedHeader=null;
  const selected=profiles.find(p=>p.id===copy.profileId);
  if(selected)profile=selected;
  state=copy.defaults;
  activeCopyDefaults=structuredClone(copy.defaults);
  state.fields.reference='';state.items=Array.isArray(state.items)?state.items:[];
  draw();notify('Template copy ready: '+copy.name+' · New document');ready();
 }catch(error){presetCopyApplied=true;notify('Template copy could not open: '+error.message)}
}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent||e.data?.type!=='docsystem-preset-command')return;const a=e.data.action;if(a==='save-template'){saveAsNewPresetTemplate(e.data.name);return}if(a==='new')newDoc();else if(a==='save')save();else if(a==='print')window.printDoc();else if(a==='business')chooseBusiness(e.data.profileId);else if(a==='view')render()});
document.addEventListener('input',e=>{const d=e.target.dataset;
 if(d.noteVisible!==undefined){state.noteVisibility??=[];state.noteVisibility[Number(d.noteVisible)]=e.target.checked;render();return}
 if(d.invoiceExtraVisible!==undefined){state.extraNotes[Number(d.invoiceExtraVisible)].enabled=e.target.checked;render();return}
 if(d.invoiceExtraNote!==undefined){state.extraNotes[Number(d.invoiceExtraNote)].text=e.target.value;render();return}if(d.group){const obj=d.group.startsWith('sign:')?(state.signatures[d.group.slice(5)]??={}):state[d.group];if(obj)obj[d.key]=e.target.value;render()}else if(d.row!==undefined){state.items[Number(d.row)][d.col]=e.target.value;const tr=e.target.closest('tr');if(tr){const v=tr.querySelectorAll('td span');if(v[0])v[0].textContent=dates(state.items[Number(d.row)])??'';if(v[1])v[1].textContent=money(rowTotal(state.items[Number(d.row)]))} $('totalSummary').textContent='Sub-Total: '+money(subtotal())+' · SST: '+money(tax())+' · Grand Total: '+money(total())+' '+currencySymbol();render()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-group="fields"][data-key="currency"]')){state.fields.currency=e.target.value;drawRows();render()}});
document.addEventListener('click',e=>{const id=e.target.id;if(id==='invoiceAddNote'){state.extraNotes??=[];state.extraNotes.push({text:'',enabled:true});drawNotes();render();return}if(e.target.dataset.invoiceRemoveNote!==undefined){state.extraNotes.splice(Number(e.target.dataset.invoiceRemoveNote),1);drawNotes();render();return}if(id==='newBtn')newDoc();else if(id==='saveBtn')save();else if(id==='printBtn')window.printDoc();else if(id==='addRow'){state.items.push({no:String(state.items.length+1),description:'',unit:'',qty:'',hireFrom:'',hireTo:'',dailyRate:''});drawRows();render()}else if(id==='removeRow'){if(state.items.length>1){state.items.pop();drawRows();render()}}else if(e.target.dataset.removeRow!==undefined){state.items.splice(Number(e.target.dataset.removeRow),1);if(!state.items.length)state.items=[{no:'1',description:'',unit:'',qty:'',hireFrom:'',hireTo:'',dailyRate:''}];drawRows();render()}});
onAuthStateChanged(auth,async u=>{user=u;if(!u){notify('Sign in to DocSystem first');return}try{const p=await getDoc(doc(db,'users',u.uid));role=p.data()?.role||'user'}catch{}try{const snap=await getDoc(doc(db,'appSettings','main'));const settings=snap.data()?.settings||{};globals=settings.globalPlaceholders||{};profiles=Array.isArray(settings.profiles)?settings.profiles.filter(p=>p?.company):[];profile=profiles.find(p=>p.id===settings.activeProfileId)||profiles[0]||null;if(!loaded){const rsp=await fetch('./templates/invoice/standard.json',{cache:'no-store'});if(!rsp.ok)throw Error('Invoice definition missing');template=await rsp.json();state=blank();loaded=true}if(docId)await loadSaved(docId);else if(params.get('copyId'))await openSavedPresetCopy();else{draw();notify('Invoice ready');ready()}}catch(e){notify('Invoice could not initialize: '+e.message)}});
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>{fitPreview();posted('height',{height:document.documentElement.scrollHeight+8})}).observe(document.querySelector('.workspace'));
</script></body></html>
